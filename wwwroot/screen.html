<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدار — شاشة المؤشر</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/madar.css">
<style>
body{overflow-x:hidden}
.stage{max-width:1500px;margin:0 auto;padding:0 3vw 24px;min-height:100vh;display:flex;flex-direction:column}
.stage .top{margin-bottom:2.2vh}
.stage .top img{height:clamp(34px,5vh,56px)}
.main{display:grid;grid-template-columns:minmax(300px,36%) minmax(0,1fr);gap:2.4vw;flex:1;align-items:stretch}
.qrcard{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:2.4vh 2vw;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.4vh}
.qrcard h1{font-size:clamp(26px,3.6vw,52px);margin:0;line-height:1.2}
.qrbox{background:#f2e7dd;border-radius:22px;padding:14px;width:min(100%,46vh,420px);aspect-ratio:1}
.qrbox svg{width:100%;height:100%;display:block}
.url{direction:ltr;unicode-bidi:isolate;font-size:clamp(12px,1.4vw,20px);color:var(--cyan);word-break:break-all}
.steps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:clamp(13px,1.4vw,19px)}
.steps b{color:var(--ivory)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1vw;margin-bottom:2vh}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1.4vh 1vw;text-align:center}
.kpi b{display:block;font-size:clamp(26px,3.4vw,54px);font-weight:800;line-height:1.2}
.kpi span{color:var(--muted);font-size:clamp(11px,1.15vw,17px)}
.board{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:2vh 1.6vw}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:1.4vh}
.bh h2{font-size:clamp(20px,2.4vw,34px);margin:0}
.bh .eyebrow{font-size:clamp(10px,1vw,14px)}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:1vh}
.lb li{display:grid;grid-template-columns:3.2vw minmax(0,1fr) auto;gap:1.2vw;align-items:center;border:1px solid var(--line);border-radius:18px;padding:1.1vh 1.2vw;background:rgba(242,231,221,.03);font-size:clamp(15px,1.9vw,28px);animation:pop .35s ease both}
.lb li:nth-child(1){border-color:rgba(241,114,51,.7);background:rgba(241,114,51,.1)}
.lb .rk{font-weight:800;color:var(--muted);text-align:center;min-width:2ch}
.lb li:nth-child(1) .rk{color:var(--orange)}
.lb .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .nm small{font-weight:400;color:var(--muted);font-size:.58em;margin-inline-start:10px}
.lb .sc{font-weight:800}
.lb .empty{display:block;text-align:center;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tip{margin-top:2vh;border:1px dashed var(--line-2);border-radius:20px;padding:1.4vh 1.6vw;display:flex;gap:14px;align-items:center;font-size:clamp(14px,1.6vw,24px)}
.tip .eyebrow{white-space:nowrap}
@media(max-width:900px){.main{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.lb li{grid-template-columns:36px minmax(0,1fr) auto}}
</style>
</head>
<body>
<div class="stage">
  <header class="top"><img src="img/madar-logo.png" alt="مدار" height="48"><span class="badge" id="badge">منصات طويق</span></header>
  <div class="main">
    <section class="qrcard" aria-label="رمز الدخول">
      <div class="eyebrow" id="orbeyebrow">MADAR · CHALLENGE</div>
      <h1 id="title">امسح الرمز وابدأ التحدي من جوالك</h1>
      <div class="qrbox" id="qr" role="img" aria-label="رمز QR لفتح منصة التحدي"></div>
      <div class="url" id="url"></div>
      <div class="steps"><span><b>1</b> افتح الكاميرا</span><span><b>2</b> اكتب اسمك</span><span><b>3</b> اختر مجالك ومستواك</span></div>
    </section>
    <section>
      <div class="kpis">
        <div class="kpi"><b class="num" id="k1">0</b><span>مشاركون اليوم</span></div>
        <div class="kpi"><b class="num" id="k2">0</b><span>جولات منتهية</span></div>
        <div class="kpi"><b class="num" id="k3">0%</b><span>متوسط الصحيحة</span></div>
        <div class="kpi"><b class="num" id="k4">0</b><span>يلعبون الآن</span></div>
      </div>
      <div class="board">
        <div class="bh"><h2 id="btitle">لوحة الصدارة</h2><span class="eyebrow">LIVE · TOP 10</span></div>
        <ol class="lb" id="lb"></ol>
      </div>
      <div class="tip"><span class="eyebrow">STAY SHARP</span><span id="tip"></span></div>
    </section>
  </div>
</div>
<script src="js/qrcode.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const orbit = ["pos","idn","jdg","trt"].includes(qs("orbit")) ? qs("orbit") : "";
const TIPS = [
  "استلمت رسالة أو مكالمة تطلب شيئًا؟ اتصل أولًا بالرقم الذي تعرفه.",
  "اتفق مع أهلك وأصدقائك على كلمة سرّ، واطلبها عند الشك.",
  "التحقق بخطوتين يغلق الباب في وجه المتسلّلين.",
  "النبرة الواثقة ليست دليلًا. اسأل: ما المصدر؟",
  "المظهر وحده لا يكفي: اعرف من أين جاءت الصورة قبل أن تصدّقها أو تشاركها.",
  "اكتب أمرًا واضحًا تحصل على إجابة أذكى: حدّد الدور والهدف والشكل."
];
let tipI = 0, last = "";
function showTip(){ $("tip").textContent = TIPS[tipI++ % TIPS.length]; }

async function boot(){
  let cfg = { platform:"none", publicUrl:"" };
  try { cfg = await api("/config"); } catch {}
  applyPlatform(cfg.platform);
  const base = pubUrl(cfg);
  const link = base + "/" + (orbit ? "?orbit=" + orbit : "");
  $("qr").innerHTML = qrSvg(link, 8);
  $("url").textContent = link.replace(/^https?:\/\//, "");
  if (orbit) {
    const o = ORBITS[orbit];
    $("orbeyebrow").textContent = `ORBIT ${o.n} · ${o.en}`;
    $("btitle").textContent = "لوحة صدارة مدار " + o.ar;
  }
  showTip(); setInterval(showTip, 9000);
  refresh(); setInterval(refresh, 3000);
}
async function refresh(){
  try {
    const [st, rows] = await Promise.all([api("/stats"), api("/leaderboard?limit=10" + (orbit ? "&orbit=" + orbit : ""))]);
    $("k1").textContent = st.participantsToday; $("k2").textContent = st.roundsToday;
    $("k3").textContent = st.avgPct + "%"; $("k4").textContent = st.playingNow;
    const sig = JSON.stringify(rows);
    if (sig !== last) {
      last = sig;
      $("lb").innerHTML = rows.length ? rows.map(r =>
        `<li><span class="rk num">${r.rank}</span><span class="nm">${esc(r.name)}<small>${esc(FIELDS[r.field].short)}</small></span><span class="sc num">${r.score}</span></li>`).join("")
        : `<li class="empty">كن أول من يظهر هنا. امسح الرمز وابدأ.</li>`;
    }
  } catch {}
}
boot();
})();
</script>
</body>
</html>
